[options]
isa rv32imc

[depth]
## Uncomment the following for Singlecycle fetch
insn            20
reg       15    25
pc_fwd    10    30
pc_bwd    10    30
liveness  1  10 75
unique    1  10 30
causal    10    30
cover     1     15

csrw            15
# csr_ill         15

## Uncomment the following for Multicycle fetch
# insn            50
# reg       15    30
# pc_fwd    10    50
# pc_bwd    10    50
# liveness  1  10 375
# unique    1  10 30
# causal    10    30
# cover     1     30

csrw            50
# csr_ill         15

[sort]
reg_ch0

[csrs]
misa
mvendorid
marchid
mimpid

# [illegal_csrs]
# 300     mu       w
# f11     mu       w
# f12     mu       w
# f13     mu       w

[defines]
# `define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RISCV_FORMAL_UMODE

[defines liveness]
`define SPARROWX32_FAIRNESS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rtl/svx32_core.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
